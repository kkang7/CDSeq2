project:
  type: book
  output-dir: _book
  resources:
    - assets/
    - downloads/
book:
  title: "CDSeq2"
  repo-url: "https://github.com/kkang7/CDSeq2"
  repo-actions: [issue]
  subtitle: "Individual-level expression, with gene-type prioritization"
  language: en
  search: true
  page-navigation: true
  sidebar:
    style: docked
    background: "#f4f7f9"
    collapse-level: 2
  page-footer:
    left: "CDSeq2 • Software guide and reproducible research"
    right: "Built with Quarto"
  chapters:
    - index.qmd
    - part: "Use CDSeq2"
      chapters:
        - chapters/install.qmd
        - chapters/quickstart.qmd
        - chapters/inputs.qmd
        - chapters/prioritization.qmd
        - chapters/training.qmd
        - chapters/applications.qmd
    - part: "Reproduce the paper"
      chapters:
        - chapters/reproduce.qmd
        - chapters/independent-eqtl.qmd
        - chapters/brain-benchmarks.qmd
        - chapters/diagnostics.qmd
        - chapters/figures.qmd
        - chapters/supplementary.qmd
        - chapters/data.qmd
    - part: "Reference"
      chapters:
        - chapters/api.qmd
        - chapters/methods.qmd
        - chapters/publishing.qmd
        - chapters/references.qmd
format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 2
    number-sections: false
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    link-external-newwindow: true
    fig-responsive: true
    html-math-method: mathjax
    smooth-scroll: true
execute:
  eval: false
  echo: true
  warning: false
  freeze: true

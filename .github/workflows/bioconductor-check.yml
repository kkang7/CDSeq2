name: Bioconductor development checks
on:
  push:
    branches: [bioconductor, codex/bioconductor-readiness]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  R_BIOC_VERSION: "3.24"
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgbuild
            bioc::BiocCheck
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
      - name: Bioconductor checks
        if: runner.os == 'Linux'
        shell: Rscript {0}
        run: |
          pkg <- pkgbuild::build('.', dest_path = tempdir(), vignettes = TRUE)
          BiocCheck::BiocCheck(pkg, `quit-with-status` = TRUE)
